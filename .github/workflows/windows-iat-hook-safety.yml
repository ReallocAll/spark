name: Windows IAT Hook Safety

on:
  pull_request:
    paths:
      - "src/native/alloc/windows_iat_hooks.*"
      - "src/native/alloc/windows_iat_hooks_windows.cpp"
      - "src/native/alloc/windows_callback_gate.h"
      - "tests/native/alloc/windows_callback_gate_test.cpp"
      - "tests/native/alloc/windows_iat_hooks_test.cpp"
      - "tests/native/alloc/windows_iat_native_test.cpp"
      - "tests/native/alloc/windows_iat_provider.cpp"
      - "tests/native/alloc/windows_iat_consumer.cpp"
      - ".github/workflows/windows-iat-hook-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-linux:
    name: Deterministic IAT lifecycle (Linux host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile deterministic lifecycle test
        run: >-
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic
          -Isrc
          src/native/alloc/windows_iat_hooks.cpp
          tests/native/alloc/windows_iat_hooks_test.cpp
          -o windows_iat_hooks_test
      - name: Compile callback lifetime gate test
        run: >-
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread
          -Isrc
          tests/native/alloc/windows_callback_gate_test.cpp
          -o windows_callback_gate_test
      - name: Run deterministic lifecycle test
        run: ./windows_iat_hooks_test
      - name: Run callback lifetime gate test
        run: ./windows_callback_gate_test

  deterministic-windows:
    name: Deterministic + native PE IAT lifecycle (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile deterministic lifecycle + native PE backend
        shell: pwsh
        run: |
          $clang = "C:\Program Files\LLVM\bin\clang-cl.exe"
          & $clang /nologo /std:c++20 /EHsc /W4 /WX /I src `
            src/native/alloc/windows_iat_hooks.cpp `
            src/native/alloc/windows_iat_hooks_windows.cpp `
            tests/native/alloc/windows_iat_hooks_test.cpp `
            /Fe:windows_iat_hooks_test.exe /link Psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $clang /nologo /std:c++20 /EHsc /W4 /WX /I src `
            tests/native/alloc/windows_callback_gate_test.cpp `
            /Fe:windows_callback_gate_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $clang /nologo /std:c++20 /EHsc /W4 /WX /LD `
            tests/native/alloc/windows_iat_provider.cpp `
            /Fe:windows_iat_provider.dll /link /IMPLIB:windows_iat_provider.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $clang /nologo /std:c++20 /EHsc /W4 /WX /LD `
            tests/native/alloc/windows_iat_consumer.cpp windows_iat_provider.lib `
            /Fe:windows_iat_consumer.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $clang /nologo /std:c++20 /EHsc /W4 /WX /I src `
            src/native/alloc/windows_iat_hooks.cpp `
            src/native/alloc/windows_iat_hooks_windows.cpp `
            tests/native/alloc/windows_iat_native_test.cpp `
            /Fe:windows_iat_native_test.exe /link Psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run deterministic lifecycle test
        shell: pwsh
        run: .\windows_iat_hooks_test.exe
      - name: Run callback lifetime gate test
        shell: pwsh
        run: .\windows_callback_gate_test.exe
      - name: Run native PE load/unload lifecycle test
        shell: pwsh
        run: .\windows_iat_native_test.exe
