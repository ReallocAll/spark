name: Apply Allocation Tidy Fix

on:
  push:
    branches: ["perf/allocation-profiler-lifecycle"]
    paths:
      - ".github/workflows/fix-allocation-tidy.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply clang-tidy fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/native/alloc/allocation_sampler_linux.cpp')
          text = path.read_text()
          old = '        std::uintptr_t value = reinterpret_cast<std::uintptr_t>(__builtin_thread_pointer());\n'
          new = '        auto value = reinterpret_cast<std::uintptr_t>(__builtin_thread_pointer());\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one tidy marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/native/alloc/allocation_sampler_linux.cpp
          git commit -m "style: satisfy allocation sampler clang-tidy"
          git push origin HEAD:perf/allocation-profiler-lifecycle
