name: PR49 One-shot Format Repair

on:
  push:
    branches:
      - exp/windows-stable-entry-hooks
    paths:
      - ".github/workflows/pr49-one-shot-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: exp/windows-stable-entry-hooks
          fetch-depth: 0

      - name: Install Clang 20 formatter
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20
          clang-format-20 --version | grep -E "clang-format version 20\."

      - name: Format tracked C++ sources and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.cpp' '*.h' | xargs clang-format-20 -i
          git diff --check
          git rm .github/workflows/pr49-one-shot-format.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u

          echo "Formatting delta:"
          git diff --cached --stat
          git diff --cached --name-only
          git commit -m "style: clang-format backend metadata identity"
          git push origin HEAD:exp/windows-stable-entry-hooks
