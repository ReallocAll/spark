name: Apply Allocation Fast Paths

on:
  push:
    branches: ["perf/allocation-profiler-lifecycle"]
    paths:
      - ".github/workflows/apply-allocation-presence-filter.yml"
      - ".github/scripts/apply_allocation_tls_fast_path.py"
      - ".github/scripts/apply_allocation_counter_shards.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply Linux allocation fast paths
        run: |
          git checkout origin/develop -- src/native/alloc/allocation_sampler_linux.cpp
          python .github/scripts/apply_allocation_tls_fast_path.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_allocation_counter_shards.py')
          text = path.read_text()
          old_success = 'replace_once("    std::atomic<std::uint64_t> successful_allocation_calls{0};\\n", "")'
          new_success = '''replace_once(
              "    std::array<HotCounters, KHookCallShards> hot_counters{};\\n"
              "    std::atomic<std::uint64_t> successful_allocation_calls{0};\\n",
              "    std::array<HotCounters, KHookCallShards> hot_counters{};\\n",
          )'''
          old_observed = 'replace_once("    std::atomic<std::uint64_t> observed_bytes{0};\\n", "")'
          new_observed = '''replace_once(
              "    std::atomic<std::uint64_t> filtered_samples{0};\\n"
              "    std::atomic<std::uint64_t> observed_bytes{0};\\n"
              "    std::atomic<std::uint64_t> dropped_samples{0};\\n",
              "    std::atomic<std::uint64_t> filtered_samples{0};\\n"
              "    std::atomic<std::uint64_t> dropped_samples{0};\\n",
          )'''
          if text.count(old_success) != 1 or text.count(old_observed) != 1:
              raise SystemExit('hot-counter script repair markers not unique')
          path.write_text(text.replace(old_success, new_success).replace(old_observed, new_observed))
          PY
          python .github/scripts/apply_allocation_counter_shards.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/native/alloc/allocation_sampler_linux.cpp')
          text = path.read_text()
          old = '''    inline static thread_local bool mCountOnlyInsideHook = false;
    inline static thread_local std::uint8_t mHookShardAnchor = 0;

    static std::size_t currentHookShard() noexcept
    {
        std::uintptr_t value = reinterpret_cast<std::uintptr_t>(&mHookShardAnchor);
        value ^= value >> 17;
        value *= 0x9e3779b97f4a7c15ULL;
        value ^= value >> 29;
        return static_cast<std::size_t>(value & (KHookCallShards - 1));
    }
'''
          new = '''    inline static thread_local bool mCountOnlyInsideHook = false;

    static std::size_t currentHookShard() noexcept
    {
        std::uintptr_t value = reinterpret_cast<std::uintptr_t>(__builtin_thread_pointer());
        value ^= value >> 17;
        value *= 0x9e3779b97f4a7c15ULL;
        value ^= value >> 29;
        return static_cast<std::size_t>(value & (KHookCallShards - 1));
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'thread-pointer shard marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/native/alloc/allocation_sampler_linux.cpp
      - name: Commit fast paths
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/native/alloc/allocation_sampler_linux.cpp
          git commit -m "perf: use native Linux hook shard identity"
          git push origin HEAD:perf/allocation-profiler-lifecycle
