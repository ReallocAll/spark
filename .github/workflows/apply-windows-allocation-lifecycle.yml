name: Apply Windows allocation lifecycle fix

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply lifecycle fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/native/alloc/allocation_sampler_windows.cpp')
          text = path.read_text()

          def replace_between(source, start, end, replacement):
              begin = source.index(start)
              finish = source.index(end, begin)
              return source[:begin] + replacement + source[finish:]

          text = replace_between(
              text,
              '    bool installHooks(std::string &error)\n',
              '    static bool anyActiveHookCalls() noexcept\n',
              '''    bool installHooks(std::string &error)\n    {\n        if (hooks_installed.load(std::memory_order_acquire)) {\n            return true;\n        }\n        if (hook_state_unknown) {\n            error = "allocation hook state is unknown after an earlier lifecycle failure";\n            return false;\n        }\n\n        const int code = funchook_install(hooks, 0);\n        if (code != FUNCHOOK_ERROR_SUCCESS) {\n            error = hookError("funchook_install", code);\n            return false;\n        }\n        hooks_installed.store(true, std::memory_order_release);\n        return true;\n    }\n\n''')

          text = replace_between(
              text,
              '    bool uninstallHooks(std::string &error)\n',
              '    bool waitForQuiescence(std::string &error) const\n',
              '''    bool uninstallHooks(std::string &error)\n    {\n        if (!hooks_installed.load(std::memory_order_acquire)) {\n            return true;\n        }\n\n        // The IAT backend closes the pinned shim admission gate first, drains\n        // callbacks that already entered Spark, clears the callback table, and\n        // only then restores IAT slots that are still owned by us. Suspending\n        // process threads here would deadlock that drain and is unnecessary for\n        // ownership-safe IAT compare/exchange.\n        const int code = funchook_uninstall(hooks, 0);\n        if (code != FUNCHOOK_ERROR_SUCCESS) {\n            error = hookError("funchook_uninstall", code);\n            return false;\n        }\n        hooks_installed.store(false, std::memory_order_release);\n        hook_state_unknown = false;\n        return true;\n    }\n\n''')

          old = '''        if (!waitForQuiescence(error)) {\n            return false;\n        }\n        const int code = funchook_destroy(hooks);\n'''
          new = '''        const int code = funchook_destroy(hooks);\n'''
          if old not in text:
              raise SystemExit('destroyHooks quiescence block not found')
          text = text.replace(old, new, 1)

          text = replace_between(
              text,
              '    bool shutdownBackend(std::string &error)\n',
              '    void tick(double mspt_ms)\n',
              '''    bool shutdownBackend(std::string &error)\n    {\n        std::scoped_lock lock(lifecycle_mutex);\n        error.clear();\n\n        tracking.store(false, std::memory_order_release);\n        running.store(false, std::memory_order_release);\n        if (!waitForTrackingQuiescence(error)) {\n            return false;\n        }\n        aggregator_running.store(false, std::memory_order_release);\n        if (aggregator_thread.joinable()) {\n            aggregator_thread.join();\n        }\n        freeEventPool();\n\n        // funchook_uninstall is the compatibility entry point for the native\n        // IAT backend. It performs the bounded pinned-shim gate/drain and\n        // ownership-safe detach, so a process-wide retry loop is neither\n        // necessary nor safe.\n        if (hooks_installed.load(std::memory_order_acquire) && !uninstallHooks(error)) {\n            return false;\n        }\n\n        return destroyHooks(error);\n    }\n\n''')

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/native/alloc/allocation_sampler_windows.cpp').read_text()
          section = text[text.index('    bool installHooks'):text.index('    FrameKey frameKeyForAddress')]
          assert 'suspendStable' not in section
          assert 'restoreOriginalTargets' not in section
          shutdown = text[text.index('    bool shutdownBackend'):text.index('    void tick(double mspt_ms)')]
          assert '30000' not in shutdown
          assert 'uninstallHooks(error)' in shutdown
          PY
          git diff --check

      - name: Commit lifecycle fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/alloc/allocation_sampler_windows.cpp
          git diff --cached --quiet && exit 0
          git commit -m "fix: drain Windows allocation shim before detach"
          git push origin "HEAD:${GITHUB_REF_NAME}"
