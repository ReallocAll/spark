name: Complete v0.6.0 unreleased notes

on:
  push:
    branches: [docs/windows-allocation-release-accuracy]
    paths:
      - ".github/workflows/complete-v060-unreleased.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/windows-allocation-release-accuracy
          fetch-depth: 0

      - name: Complete Unreleased notes from merged production work
        shell: python
        run: |
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")

          old_gamerule = "- Include current Endstone game-rule values in exported Spark world metadata.\n"
          new_gamerule = (
              "- Export current Bedrock game-rule values with canonical names, runtime/API-first\n"
              "  defaults plus safe fallbacks, and locatorBar-to-playerWaypoints migration metadata.\n"
          )
          if old_gamerule not in text:
              raise SystemExit("gamerule changelog anchor not found")
          text = text.replace(old_gamerule, new_gamerule, 1)

          anchor = "- Support Java-compatible Spark configuration environment variables.\n\n"
          additions = """- Support Java-compatible Spark configuration environment variables.
- Add cached BlockActor/tile-entity world statistics with availability semantics.
- Export a reviewed safe subset of `server.properties`, with sensitive-name guards
  and administrator opt-in for additional safe keys.
- Preserve player initiator UUID metadata across profiler, health, activity, upload,
  and recovery paths.
- Export active Bedrock behavior-pack metadata without depending on internal
  `ResourcePackStack` ABI details.
- Add a one-hour native process-memory curve, including cgroup v2 and Windows Job
  Object limits when available.
- Add process-wide native allocation-rate metrics and 1m/5m/15m rolling rates on
  Linux and Windows.
- Attribute sampled Python plugin call chains on CPython 3.12+ using a bounded PEP
  669 shadow stack while keeping sampling native; CPython 3.11 remains native-only.

"""
          if anchor not in text:
              raise SystemExit("Added section insertion anchor not found")
          text = text.replace(anchor, additions, 1)

          changed_anchor = """- Add Windows x64 native allocation profiling through a process-lifetime pinned
  shim and IAT redirection, with fail-closed callback draining and ownership-safe
  teardown before unloadable Spark plugin code is detached.

### Fixed
"""
          changed = """- Add Windows x64 native allocation profiling through a process-lifetime pinned
  shim and IAT redirection, with fail-closed callback draining and ownership-safe
  teardown before unloadable Spark plugin code is detached.

### Changed

- Reduce allocation-profiler hot-path contention with sharded lifecycle/statistics
  state and bounded retries while preserving fail-closed drop reporting.
- Cache the native Linux thread ID per PEP 669 callback thread instead of issuing a
  `gettid` syscall for every Python execution event.

### Fixed
"""
          if changed_anchor not in text:
              raise SystemExit("Changed section anchor not found")
          text = text.replace(changed_anchor, changed, 1)

          fixed_anchor = """- Match Java spark's tick-duration placeholder windows and percentile ranks, and
  avoid rebuilding unrelated rolling statistics for each placeholder value.

## [0.5.3][0.5.3] - 2026-08-14
"""
          fixed = """- Match Java spark's tick-duration placeholder windows and percentile ranks, and
  avoid rebuilding unrelated rolling statistics for each placeholder value.
- Journal newly observed module definitions before recovered execution samples can
  reference them, preserving crash replay across multi-session hard kills.
- Prevent the spark viewer's process-memory denominator from decoding as zero while
  keeping native RSS/committed-memory semantics strict.
- Skip unsafe device-metadata ping polling for unauthenticated headless BDS clients.
- Preserve a completed allocation profile until serialization finishes before
  persistent allocation-rate counting resumes.
- Canonicalize Python plugin identities and filter only Spark's observer bridge
  frames without hiding unrelated user ctypes/libffi/native paths.
- Preserve the real Linux allocation caller frame by correcting the cpptrace stack
  skip count used by allocation hooks.

## [0.5.3][0.5.3] - 2026-08-14
"""
          if fixed_anchor not in text:
              raise SystemExit("Fixed section insertion anchor not found")
          text = text.replace(fixed_anchor, fixed, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate changelog and release tooling
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_release_changelog.py
          python tools/release_changelog.py \
            --version 0.6.0 \
            --date 2026-09-02 \
            --repository ReallocAll/spark \
            --output /tmp/CHANGELOG.md \
            --notes /tmp/release_body.md
          test -s /tmp/release_body.md
          grep -F "Windows x64 native allocation profiling" /tmp/release_body.md
          grep -F "sampled Python plugin call chains" /tmp/release_body.md
          grep -F "native allocation-rate metrics" /tmp/release_body.md
          git diff --check

      - name: Commit changelog only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-v060-unreleased.yml
          git add CHANGELOG.md
          git commit -m "docs: complete v0.6.0 unreleased notes"
          git push origin HEAD:docs/windows-allocation-release-accuracy
