name: Apply Linux allocation caller-frame fix

on:
  push:
    branches:
      - fix/linux-allocation-caller-frame

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
      - name: Apply exact stack-skip correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/native/alloc/allocation_sampler_linux.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'constexpr std::size_t KFramesToSkip = 4;'
          new = '''// cpptrace::safe_generate_raw_trace adds one frame to the requested skip internally.\n// Skip only recordAllocation -> handleMalloc -> hookMalloc here so the real allocating caller is retained.\nconstexpr std::size_t KFramesToSkip = 3;'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'constexpr std::size_t KFramesToSkip = 3;' not in text:
              raise SystemExit('expected Linux allocation stack-skip constant not found')
          PY
          if git diff --quiet; then
            echo 'caller-frame fix already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/alloc/allocation_sampler_linux.cpp
          git commit -m 'fix: preserve Linux allocation caller frame'
          git push origin HEAD:fix/linux-allocation-caller-frame
