name: Apply unaligned IAT skip fix

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks
    paths:
      - ".github/workflows/apply-unaligned-iat-skip-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/windows-allocation-safe-hooks
          fetch-depth: 0

      - name: Apply source and regression-test patch
        run: python .github/patch_unaligned_iat.py

      - name: Install clang-format 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20

      - name: Format and validate patch
        run: |
          clang-format-20 -i src/native/alloc/windows_iat_hooks_windows.cpp tests/native/alloc/windows_iat_native_test.cpp
          git diff --check

      - name: Commit fix and remove temporary files
        run: |
          rm .github/workflows/apply-unaligned-iat-skip-fix.yml .github/patch_unaligned_iat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/alloc/windows_iat_hooks_windows.cpp tests/native/alloc/windows_iat_native_test.cpp .github/workflows/apply-unaligned-iat-skip-fix.yml .github/patch_unaligned_iat.py
          git commit -m "fix: skip unaligned Windows IAT candidates safely"
          git push origin HEAD:fix/windows-allocation-safe-hooks
