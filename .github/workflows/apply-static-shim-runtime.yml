name: Apply static allocation shim runtime

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Make allocation shim CRT-self-contained
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text()
          old = '    set_target_properties(spark_allocation_shim PROPERTIES OUTPUT_NAME "spark_allocation_shim")\n'
          new = '''    set_target_properties(spark_allocation_shim PROPERTIES\n            OUTPUT_NAME "spark_allocation_shim"\n            MSVC_RUNTIME_LIBRARY "MultiThreaded")\n'''
          if old not in text:
              raise SystemExit('allocation shim target properties block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "fix: statically link allocation shim runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
