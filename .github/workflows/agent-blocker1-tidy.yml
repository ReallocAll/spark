name: Agent Blocker 1 Tidy

on:
  push:
    branches:
      - fix/linux-elf-hook-lifetime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/linux-elf-hook-lifetime
          fetch-depth: 0
      - name: Apply tidy fixes
        shell: bash
        run: |
          grep -q '^#include <ranges>$' src/native/alloc/elf_import_hooks.cpp || sed -i '/#include <limits>/a #include <ranges>' src/native/alloc/elf_import_hooks.cpp
          python3 -c 'from pathlib import Path; p=Path("src/native/alloc/elf_import_hooks.cpp"); s=p.read_text(); s=s.replace("        for (auto it = handles.rbegin(); it != handles.rend(); ++it) {\n            if (*it != nullptr) {\n                ::dlclose(*it);\n            }\n        }", "        for (void *handle : std::ranges::reverse_view(handles)) {\n            if (handle != nullptr) {\n                ::dlclose(handle);\n            }\n        }"); s=s.replace("::dlinfo(handle, RTLD_DI_LINKMAP, &map)", "::dlinfo(handle, RTLD_DI_LINKMAP, static_cast<void *>(&map))"); s=s.replace("RefreshContext context{&image, false};", "RefreshContext context{.image = &image, .found = false};"); p.write_text(s)'
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/agent-blocker1-tidy.yml
          git config user.name ReallocAll
          git config user.email 63277109+ReallocAll@users.noreply.github.com
          git add src/native/alloc/elf_import_hooks.cpp .github/workflows/agent-blocker1-tidy.yml
          git commit -m "fix: satisfy ELF hook clang-tidy"
          git push origin HEAD:fix/linux-elf-hook-lifetime
