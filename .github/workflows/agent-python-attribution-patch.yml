name: Apply Python attribution patch

on:
  push:
    branches:
      - feat/python-function-attribution
    paths:
      - .github/workflows/agent-python-attribution-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python-function-attribution
          fetch-depth: 1

      - name: Patch PEP 669 new-thread bootstrap and plugin source mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/platform/endstone/python_attribution.h')
          text = path.read_text()

          old = """import ctypes\nimport os\nimport sys\nimport sysconfig\nimport threading\n"""
          new = """import ctypes\nimport importlib.metadata\nimport os\nimport sys\nimport sysconfig\nimport threading\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """_cache = {}\n_module_files = {}\n_tool_id = None\n_plugin_root = os.path.normcase(os.path.abspath(os.path.join('plugins', '.local')))\n_paths = sysconfig.get_paths()\n"""
          new = """_cache = {}\n_module_files = {}\n_tool_id = None\n_thread_state = threading.local()\n_plugin_root = os.path.normcase(os.path.abspath(os.path.join('plugins', '.local')))\n_plugin_sources = {}\ntry:\n    for _entry_point in importlib.metadata.entry_points(group='endstone'):\n        _module = _entry_point.value.partition(':')[0].split('.', 1)[0]\n        if _module:\n            _plugin_sources.setdefault(_module, _entry_point.name)\nexcept BaseException:\n    pass\n_paths = sysconfig.get_paths()\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """    if _under(filename, _plugin_root):\n        top = module.split('.', 1)[0]\n        source = top[9:] if top.startswith('endstone_') else top\n        return 0, source\n"""
          new = """    if _under(filename, _plugin_root):\n        top = module.split('.', 1)[0]\n        fallback = top[9:] if top.startswith('endstone_') else top\n        source = _plugin_sources.get(top, fallback.replace('_', '-'))\n        return 0, source\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """def _safe_event(kind, code):\n    try:\n        _EVENT(kind, _code_id(code))\n    except BaseException as exc:\n        try:\n            _FAILURE(str(exc).encode('utf-8', 'replace'))\n        except BaseException:\n            pass\n"""
          new = """def _safe_event(kind, code):\n    try:\n        if not getattr(_thread_state, 'bootstrapped', False):\n            current = sys._current_frames().get(threading.get_ident())\n            chain = _bootstrap_frame(threading.get_native_id(), current) if current is not None else []\n            _thread_state.bootstrapped = True\n            # PY_START/PY_RESUME/PY_THROW run with the entered frame active.\n            # If the first event on a newly-created thread is already present\n            # in the public frame chain, bootstrap has accounted for it.\n            if kind <= 2 and code in chain:\n                return\n        _EVENT(kind, _code_id(code))\n    except BaseException as exc:\n        try:\n            _FAILURE(str(exc).encode('utf-8', 'replace'))\n        except BaseException:\n            pass\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """def _bootstrap():\n    _refresh_modules()\n    native_by_ident = {\n        thread.ident: thread.native_id\n        for thread in threading.enumerate()\n        if thread.ident is not None and getattr(thread, 'native_id', None) is not None\n    }\n    for ident, frame in sys._current_frames().items():\n        native_id = native_by_ident.get(ident)\n        if native_id is None:\n            continue\n        chain = []\n        cursor = frame\n        while cursor is not None:\n            module_name = cursor.f_globals.get('__name__', '')\n            code = cursor.f_code\n            if module_name != '_endstone_spark_monitor' and not (\n                code.co_name == '<module>' and code.co_filename == '<string>'\n            ):\n                chain.append(code)\n            cursor = cursor.f_back\n        _BOOT_RESET(int(native_id))\n        for code in reversed(chain):\n            _BOOT_PUSH(int(native_id), _code_id(code))\n"""
          new = """def _bootstrap_frame(native_id, frame):\n    chain = []\n    cursor = frame\n    while cursor is not None:\n        module_name = cursor.f_globals.get('__name__', '')\n        code = cursor.f_code\n        if module_name != '_endstone_spark_monitor' and not (\n            code.co_name == '<module>' and code.co_filename == '<string>'\n        ):\n            chain.append(code)\n        cursor = cursor.f_back\n    _BOOT_RESET(int(native_id))\n    for code in reversed(chain):\n        _BOOT_PUSH(int(native_id), _code_id(code))\n    return chain\n\n\ndef _bootstrap():\n    _refresh_modules()\n    native_by_ident = {\n        thread.ident: thread.native_id\n        for thread in threading.enumerate()\n        if thread.ident is not None and getattr(thread, 'native_id', None) is not None\n    }\n    current_ident = threading.get_ident()\n    for ident, frame in sys._current_frames().items():\n        native_id = native_by_ident.get(ident)\n        if native_id is None:\n            continue\n        _bootstrap_frame(native_id, frame)\n        if ident == current_ident:\n            _thread_state.bootstrapped = True\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text)

          test = Path('tests/native/python/python_attribution_runtime_test.cpp')
          value = test.read_text()
          assert value.count("endstone_hotspot.main") == 2
          value = value.replace("endstone_hotspot.main", "endstone_spark_python_hotspot_test.main")
          assert value.count('metadata.plugin_source == "hotspot"') == 1
          value = value.replace(
              'metadata.plugin_source == "hotspot"',
              'metadata.plugin_source == "spark-python-hotspot-test"',
          )
          test.write_text(value)
          PY

      - name: Remove one-shot patch workflow
        run: rm .github/workflows/agent-python-attribution-patch.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/platform/endstone/python_attribution.h tests/native/python/python_attribution_runtime_test.cpp .github/workflows/agent-python-attribution-patch.yml
          git diff --cached --check
          git commit -m "fix: bootstrap Python stacks on newly created threads"
          git push origin HEAD:feat/python-function-attribution
