name: Allocation Profiler Microbenchmark

on:
  push:
    branches: ["perf/allocation-profiler-lifecycle"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux allocation microbenchmark
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "conan>=2,<3"
      - uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}
      - run: conan install . --build=missing
      - run: cmake --preset conan-relwithdebinfo
      - run: cmake --build --preset conan-relwithdebinfo --target spark_allocation_benchmark
      - name: Run allocation microbenchmark
        run: |
          exe="$(find build/RelWithDebInfo -type f -name spark_allocation_benchmark -perm -111 | head -n 1)"
          test -n "$exe"
          "$exe"

  windows:
    name: Windows allocation microbenchmark
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Select clang-cl 20
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = & "$llvmBin\clang-cl.exe" --version
          $version
          if (-not ($version | Select-String "clang version 20\.")) { throw "clang-cl 20 is required" }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "conan>=2,<3"
      - uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}
      - run: conan install . --build=missing
      - run: cmake --preset conan-relwithdebinfo
      - run: cmake --build --preset conan-relwithdebinfo --target spark_allocation_benchmark spark_allocation_shim
      - name: Run allocation microbenchmark
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/RelWithDebInfo -Recurse -Filter spark_allocation_benchmark.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "spark_allocation_benchmark.exe not found" }
          $shim = Join-Path $exe.DirectoryName "spark_allocation_shim.dll"
          if (-not (Test-Path $shim)) { throw "spark_allocation_shim.dll not found beside benchmark executable" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
