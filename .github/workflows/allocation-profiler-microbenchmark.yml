name: Allocation Profiler Microbenchmark

on:
  push:
    branches: ["perf/allocation-profiler-lifecycle"]

permissions:
  contents: read

# Temporary Linux-only validation for TLS, lifecycle presence, sharded hook counters, and sharded hot statistics.
jobs:
  linux:
    name: Linux allocation microbenchmark
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "conan>=2,<3"
      - uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}
      - run: conan install . --build=missing
      - run: cmake --preset conan-relwithdebinfo
      - run: cmake --build --preset conan-relwithdebinfo --target spark_allocation_benchmark
      - name: Run allocation microbenchmark
        run: |
          exe="$(find build/RelWithDebInfo -type f -name spark_allocation_benchmark -perm -111 | head -n 1)"
          test -n "$exe"
          set +e
          "$exe"
          rc=$?
          set -e
          echo "benchmark_exit_code=$rc (live-only pressure failure is diagnostic in this temporary workflow)"
