name: Apply allocation export ordering fix

on:
  push:
    branches:
      - fix/allocation-export-before-persistent-resume
    paths:
      - ".github/workflows/apply-allocation-export-order-fix.yml"
      - ".github/scripts/apply_allocation_export_order_fix.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/allocation-export-before-persistent-resume
          fetch-depth: 0
      - name: Apply exact source patch
        run: python .github/scripts/apply_allocation_export_order_fix.py
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/profiler/profiler.h src/core/profiler/profiler.cpp \
                  src/application/profiler/profile_exporter.h src/application/profiler/profile_exporter.cpp \
                  src/application/profiler/profiler_service.cpp tests/core/profiler/profiler_export_test.cpp
          git diff --cached --check
          git commit -m "fix: preserve allocation profile until export"
          git push origin HEAD:fix/allocation-export-before-persistent-resume
