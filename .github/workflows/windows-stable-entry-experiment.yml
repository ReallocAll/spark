name: Windows Stable Entry Experiment

on:
  push:
    branches:
      - "exp/windows-stable-entry-hooks"
      - "exp/windows-no-shim-permanent-gateway"
    paths:
      - "src/native/alloc/windows_stable_entry_*"
      - "tests/native/alloc/windows_stable_entry_*"
      - "tests/native/alloc/stable_entry/**"
      - ".github/workflows/windows-stable-entry-experiment.yml"
  pull_request:
    paths:
      - "src/native/alloc/windows_stable_entry_*"
      - "tests/native/alloc/windows_stable_entry_*"
      - "tests/native/alloc/stable_entry/**"
      - ".github/workflows/windows-stable-entry-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-state-machine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile fail-closed state-machine tests
        run: >-
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic
          -Isrc
          src/native/alloc/windows_stable_entry_experiment.cpp
          tests/native/alloc/windows_stable_entry_experiment_test.cpp
          -o windows_stable_entry_experiment_test
      - name: Run fail-closed state-machine tests
        run: ./windows_stable_entry_experiment_test
      - name: Compile atomic encoding tests
        run: >-
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic
          -Isrc
          src/native/alloc/windows_stable_entry_atomic.cpp
          tests/native/alloc/windows_stable_entry_atomic_encoding_test.cpp
          -o windows_stable_entry_atomic_encoding_test
      - name: Run atomic encoding tests
        run: ./windows_stable_entry_atomic_encoding_test

  native-windows-atomic:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Configure standalone atomic stable-entry experiment
        shell: pwsh
        run: cmake -S tests/native/alloc/stable_entry -B build/stable-entry -A x64
      - name: Build native atomic and resolver probes
        shell: pwsh
        run: cmake --build build/stable-entry --config Release --parallel
      - name: Report real allocator entry alignment and hotpatch padding
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_alignment_test.exe
      - name: Prove prepare-only bounded relocation
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_relocation_probe.exe
      - name: Dump relocation diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path funchook-stable-entry.log) {
            Get-Content funchook-stable-entry.log
          } else {
            Write-Host "no funchook relocation log produced"
          }
      - name: Isolate prepare install call restore lifecycle
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_lifecycle_probe.exe
      - name: Prove CMPXCHG16B data atomicity under contention
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe cmpxchg16
      - name: Run single-thread executable entry lifecycle
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe synthetic-single
      - name: Fail closed when original ownership changes before install
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe ownership-install
      - name: Fail closed when third party replaces installed entry
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe ownership-restore
      - name: Reject false quiescence in pre-guard corridor
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe pre-guard-rip
      - name: Fail closed under ProcessDynamicCodePolicy
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe dynamic-code
      - name: Classify reclaim lifetime faults across generations
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_reclaim_diagnostic_test.exe
      - name: Run concurrent 1000-cycle executable entry stress
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe synthetic-stress
      - name: Run real UCRT malloc entry probe
        shell: pwsh
        run: .\build\stable-entry\Release\windows_stable_entry_atomic_test.exe ucrt-malloc
