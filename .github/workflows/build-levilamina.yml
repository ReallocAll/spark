name: Build LeviLamina

on:
  push:
    branches: [develop, "ci/**", levilamina-26.20]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  levilamina:
    name: Build & test LeviLamina
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Select clang-cl 20 and verify LLVM tools
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path -LiteralPath $llvmBin -PathType Container)) {
            throw "LLVM installation directory is missing: $llvmBin"
          }
          $env:Path = "$llvmBin;$env:Path"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          foreach ($name in @("clang-cl.exe", "llvm-dlltool.exe", "llvm-rc.exe", "lld-link.exe")) {
            if (-not (Test-Path -LiteralPath (Join-Path $llvmBin $name) -PathType Leaf)) {
              throw "required LLVM tool is missing: $name"
            }
          }
          $version = (& (Join-Path $llvmBin "clang-cl.exe") --version) -join [Environment]::NewLine
          $version
          if ($version -notmatch "clang version 20\.") {
            throw "clang-cl 20 is required"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        shell: pwsh
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-ll-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Test public LeviLamina bootstrap
        shell: pwsh
        run: |
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP ("spark-ll-levilamina-" + $env:GITHUB_RUN_ID)
          & pwsh -NoProfile -File tools/levilamina/prepare-sdk.ps1 -SelfTest -OutputRoot $bootstrapRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned public LeviLamina inputs
        shell: pwsh
        run: |
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP ("spark-ll-levilamina-" + $env:GITHUB_RUN_ID)
          & pwsh -NoProfile -File tools/levilamina/prepare-sdk.ps1 -OutputRoot $bootstrapRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receiptPath = Join-Path $bootstrapRoot "setup-receipt.json"
          $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.status -ne "success") { throw "LeviLamina bootstrap did not succeed" }
          foreach ($name in @("sdk_root", "runtime_dll", "runtime_pdb", "runtime_data", "prelink", "symbolprovider_source")) {
            $path = [string]$receipt.paths.$name
            if ([string]::IsNullOrWhiteSpace($path)) {
              throw "bootstrap output path is missing: $name"
            }
            if ($name -eq "sdk_root") {
              if (-not (Test-Path -LiteralPath $path -PathType Container)) { throw "bootstrap SDK root is missing" }
            } elseif (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "bootstrap output file is missing: $name"
            }
            if (-not $path.StartsWith($bootstrapRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "bootstrap output escaped runner temp: $name"
            }
            "$($name.ToUpperInvariant())=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "SPARK_LL_RECEIPT=$receiptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Conan dependencies
        shell: pwsh
        run: conan install . --build=missing -of build-ll

      - name: Configure LeviLamina target
        shell: pwsh
        run: |
          $allowlist = (Resolve-Path -LiteralPath "tools/levilamina/spark-levilamina-imports.json").Path
          $configureArgs = @(
            "-DCMAKE_TOOLCHAIN_FILE=build-ll/build/RelWithDebInfo/generators/conan_toolchain.cmake",
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
            "-DENDSTONE_SPARK_BUILD_PLUGIN=OFF",
            "-DENDSTONE_SPARK_BUILD_SELFTEST=OFF",
            "-DSPARK_BUILD_LEVILAMINA=ON",
            "-DSPARK_LL_SDK_ROOT=$env:SDK_ROOT",
            "-DSPARK_LL_RUNTIME_DLL=$env:RUNTIME_DLL",
            "-DSPARK_LL_RUNTIME_PDB=$env:RUNTIME_PDB",
            "-DSPARK_LL_RUNTIME_DATA=$env:RUNTIME_DATA",
            "-DSPARK_LL_PRELINK=$env:PRELINK",
            "-DSPARK_LL_SYMBOLPROVIDER_SOURCE=$env:SYMBOLPROVIDER_SOURCE",
            "-DSPARK_LL_IMPORT_ALLOWLIST=$allowlist"
          )
          & cmake -S . -B build-ll -G Ninja $configureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all configured LeviLamina targets
        shell: pwsh
        run: |
          & cmake --build build-ll --config RelWithDebInfo --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full CTest suite
        shell: pwsh
        run: |
          & ctest --test-dir build-ll -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact LeviLamina artifact set
        shell: pwsh
        run: |
          $artifactRoot = (Resolve-Path -LiteralPath "build-ll/bin/spark").Path
          $expected = @("levilamina_spark.dll", "levilamina_spark.pdb", "manifest.json")
          foreach ($name in $expected) {
            $sourcePath = Join-Path $artifactRoot $name
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "required artifact is missing: $name"
            }
          }
          $artifactStage = Join-Path $env:RUNNER_TEMP "spark-ll-artifacts"
          if (Test-Path -LiteralPath $artifactStage) {
            throw "artifact staging directory already exists: $artifactStage"
          }
          New-Item -ItemType Directory -Path $artifactStage | Out-Null
          foreach ($name in $expected) {
            Copy-Item -LiteralPath (Join-Path $artifactRoot $name) -Destination (Join-Path $artifactStage $name)
          }
          $staged = @(Get-ChildItem -LiteralPath $artifactStage -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($staged.Count -ne $expected.Count -or @($staged | Where-Object { $expected -notcontains $_ }).Count -ne 0 -or @($expected | Where-Object { $staged -notcontains $_ }).Count -ne 0) {
            throw "artifact staging set does not match the expected files"
          }

      - name: Upload LeviLamina artifacts
        uses: actions/upload-artifact@v7
        with:
          name: levilamina-spark-${{ github.run_id }}
          path: ${{ runner.temp }}/spark-ll-artifacts
          if-no-files-found: error
          retention-days: 14
