name: Performance primitives

on:
  push:
    branches:
      - perf/self-overhead
  workflow_dispatch:

concurrency:
  group: spark-performance-primitives-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux primitive microbenchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Clang 20 and strace
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev strace
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
          clang++ --version | head -1

      - name: Build native thread-id benchmark
        shell: bash
        run: |
          set -euo pipefail
          clang++ -O3 -DNDEBUG -std=c++23 -pthread -Isrc \
            tests/thread_id_benchmark.cpp src/native/sampler/thread_info.cpp \
            -o thread_id_benchmark

      - name: Run native thread-id benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-evidence/thread-id
          for rep in $(seq 1 9); do
            ./thread_id_benchmark | tee "perf-evidence/thread-id/rep-${rep}.csv"
          done
          SPARK_THREAD_ID_BENCH_ITERATIONS=1000 \
            strace -f -c -e trace=gettid ./thread_id_benchmark \
            > perf-evidence/thread-id/strace.stdout \
            2> perf-evidence/thread-id/strace.txt
          python - <<'PY' | tee perf-evidence/thread-id/summary.txt
          import csv
          import pathlib
          import statistics

          grouped = {}
          for path in pathlib.Path('perf-evidence/thread-id').glob('rep-*.csv'):
              for row in csv.DictReader(path.open()):
                  key = (row['case'], int(row['threads']))
                  grouped.setdefault(key, []).append(float(row['median_ns_per_call']))
          print('case,threads,runs,mean_ns,median_ns,stdev_ns,cv_percent,min_ns,max_ns')
          for key in sorted(grouped):
              values = grouped[key]
              mean = statistics.fmean(values)
              median = statistics.median(values)
              sd = statistics.stdev(values) if len(values) > 1 else 0.0
              cv = sd / mean * 100.0 if mean else 0.0
              print(f'{key[0]},{key[1]},{len(values)},{mean:.3f},{median:.3f},{sd:.3f},{cv:.2f},{min(values):.3f},{max(values):.3f}')
          for threads in (1, 4):
              direct = statistics.median(grouped[('direct', threads)])
              cached = statistics.median(grouped[('cached', threads)])
              improvement = (direct - cached) / direct * 100.0
              print(f'threads={threads}: direct={direct:.3f} ns cached={cached:.3f} ns reduction={improvement:.2f}%')
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-perf-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure allocation benchmark
        run: cmake --preset conan-relwithdebinfo

      - name: Build allocation benchmark
        run: cmake --build --preset conan-relwithdebinfo --target spark_allocation_benchmark

      - name: Run allocation benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-evidence/allocation
          for rep in $(seq 1 7); do
            ./build/RelWithDebInfo/spark_allocation_benchmark | tee "perf-evidence/allocation/rep-${rep}.csv"
          done
          python - <<'PY' | tee perf-evidence/allocation/summary.txt
          import csv
          import pathlib
          import statistics

          grouped = {}
          diagnostics = {}
          required_columns = {
              'stop_outcome', 'freed_samples', 'live_samples', 'peak_live_samples',
              'live_index_capacity', 'lifecycle_dropped', 'contention_dropped',
              'dropped_samples', 'dropped_events', 'dropped_tick_events',
              'thread_state_drops', 'thread_identity_cache_drops',
              'profile_storage_sample_drops', 'profile_storage_exhausted',
              'pending_sample_drops', 'data_incomplete',
          }
          for path in pathlib.Path('perf-evidence/allocation').glob('rep-*.csv'):
              rows = list(csv.DictReader(path.open()))
              for row in rows:
                  missing = required_columns.difference(row)
                  if missing:
                      raise RuntimeError(f'{path}: missing allocation diagnostics: {sorted(missing)}')
                  key = (row['case'], int(row['threads']))
                  grouped.setdefault(key, []).append(float(row['ns_per_op']))
                  diagnostics.setdefault(key, []).append(row)
          expected_keys = {
              ('unprofiled', 1), ('unprofiled', 4), ('count-only', 1), ('count-only', 4),
              ('disabled-hooks', 1), ('disabled-hooks', 4), ('normal-default', 1),
              ('normal-default', 4), ('normal-4k', 1), ('normal-4k', 4), ('live-4k', 1),
              ('live-4k', 4), ('saturated', 4),
          }
          if set(grouped) != expected_keys:
              raise RuntimeError(f'unexpected allocation benchmark cases: {sorted(grouped)}')
          if any(len(values) != 7 for values in grouped.values()):
              raise RuntimeError('allocation benchmark did not produce seven complete repetitions')
          print('case,threads,runs,mean_ns_per_op,median_ns_per_op,stdev_ns,cv_percent,min_ns,max_ns')
          for key in sorted(grouped):
              values = grouped[key]
              mean = statistics.fmean(values)
              median = statistics.median(values)
              sd = statistics.stdev(values) if len(values) > 1 else 0.0
              cv = sd / mean * 100.0 if mean else 0.0
              print(f'{key[0]},{key[1]},{len(values)},{mean:.3f},{median:.3f},{sd:.3f},{cv:.2f},{min(values):.3f},{max(values):.3f}')
          for threads in (1, 4):
              raw = statistics.median(grouped[('unprofiled', threads)])
              disabled = statistics.median(grouped[('disabled-hooks', threads)])
              count = statistics.median(grouped[('count-only', threads)])
              print(f'threads={threads}: unprofiled={raw:.3f} ns disabled-hooks={disabled:.3f} ns count-only={count:.3f} ns count-only-tax={(count-raw)/raw*100.0:.2f}%')
          print('case,threads,stop_outcomes,median_lifecycle_dropped,median_contention_dropped')
          for key in sorted(diagnostics):
              rows = diagnostics[key]
              outcomes = '|'.join(sorted({row['stop_outcome'] for row in rows}))
              lifecycle = statistics.median(int(row['lifecycle_dropped']) for row in rows)
              contention = statistics.median(int(row['contention_dropped']) for row in rows)
              print(f'{key[0]},{key[1]},{outcomes},{lifecycle:.0f},{contention:.0f}')
          PY

      - name: Add summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Primitive performance evidence'
            echo
            echo '## Native thread id'
            echo '```text'
            cat perf-evidence/thread-id/summary.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## gettid syscall count'
            echo '```text'
            cat perf-evidence/thread-id/strace.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Allocation hook'
            echo '```text'
            cat perf-evidence/allocation/summary.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-primitives-${{ github.run_id }}
          path: perf-evidence
          if-no-files-found: warn
          retention-days: 30
