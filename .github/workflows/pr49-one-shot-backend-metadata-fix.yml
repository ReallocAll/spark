name: PR49 One-shot Backend Metadata Fix

on:
  push:
    branches:
      - exp/windows-stable-entry-hooks
    paths:
      - ".github/workflows/pr49-one-shot-backend-metadata-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: exp/windows-stable-entry-hooks
          fetch-depth: 0

      - name: Apply backend identity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/funchook.h",
              "const char *funchook_error_message(funchook_t *funchook);\n",
              "const char *funchook_error_message(funchook_t *funchook);\n"
              "const char *funchook_backend_id(void);\n"
              "const char *funchook_backend_name(void);\n",
          )

          replace_once(
              "src/native/alloc/allocation_sampler.h",
              "    bool failure(std::string &error) const;\n"
              "    const std::vector<AllocationHookCapability> &hookCapabilities() const;\n",
              "    bool failure(std::string &error) const;\n"
              "    static const char *backendId() noexcept;\n"
              "    static const char *backendName() noexcept;\n"
              "    const std::vector<AllocationHookCapability> &hookCapabilities() const;\n",
          )

          replace_once(
              "src/native/alloc/allocation_sampler_windows.cpp",
              "const std::vector<AllocationHookCapability> &AllocationSampler::hookCapabilities() const\n"
              "{\n"
              "    return impl_->hook_capabilities;\n"
              "}\n"
              "\n"
              "std::size_t AllocationSampler::hookTargetCount() const\n",
              "const char *AllocationSampler::backendId() noexcept\n"
              "{\n"
              "    return funchook_backend_id();\n"
              "}\n"
              "\n"
              "const char *AllocationSampler::backendName() noexcept\n"
              "{\n"
              "    return funchook_backend_name();\n"
              "}\n"
              "\n"
              "const std::vector<AllocationHookCapability> &AllocationSampler::hookCapabilities() const\n"
              "{\n"
              "    return impl_->hook_capabilities;\n"
              "}\n"
              "\n"
              "std::size_t AllocationSampler::hookTargetCount() const\n",
          )

          replace_once(
              "src/native/alloc/allocation_sampler_linux.cpp",
              "const std::vector<AllocationHookCapability> &AllocationSampler::hookCapabilities() const\n"
              "{\n"
              "    return impl_->hook_capabilities;\n"
              "}\n"
              "std::size_t AllocationSampler::hookTargetCount() const\n",
              "const char *AllocationSampler::backendId() noexcept\n"
              "{\n"
              "    return \"native-glibc/elf-import\";\n"
              "}\n"
              "\n"
              "const char *AllocationSampler::backendName() noexcept\n"
              "{\n"
              "    return \"Linux glibc/ELF import slots\";\n"
              "}\n"
              "\n"
              "const std::vector<AllocationHookCapability> &AllocationSampler::hookCapabilities() const\n"
              "{\n"
              "    return impl_->hook_capabilities;\n"
              "}\n"
              "std::size_t AllocationSampler::hookTargetCount() const\n",
          )

          replace_once(
              "src/native/alloc/allocation_sampler_stub.cpp",
              "bool AllocationSampler::failure(std::string &error) const\n"
              "{\n"
              "    error.clear();\n"
              "    return false;\n"
              "}\n"
              "\n"
              "const std::vector<AllocationHookCapability> &AllocationSampler::hookCapabilities() const\n",
              "bool AllocationSampler::failure(std::string &error) const\n"
              "{\n"
              "    error.clear();\n"
              "    return false;\n"
              "}\n"
              "\n"
              "const char *AllocationSampler::backendId() noexcept\n"
              "{\n"
              "    return \"native-allocation/unsupported\";\n"
              "}\n"
              "\n"
              "const char *AllocationSampler::backendName() noexcept\n"
              "{\n"
              "    return \"Unsupported native allocation backend\";\n"
              "}\n"
              "\n"
              "const std::vector<AllocationHookCapability> &AllocationSampler::hookCapabilities() const\n",
          )

          for path, error_text, backend_id, backend_name in (
              (
                  "src/native/alloc/windows_iat_funchook_compat.cpp",
                  "Windows IAT allocation hook context is null",
                  "native-ucrt/funchook",
                  "Windows UCRT/funchook",
              ),
              (
                  "src/native/alloc/windows_permanent_iat_funchook_compat.cpp",
                  "permanent Windows IAT allocation hook context is null",
                  "native-ucrt/permanent-iat",
                  "Windows UCRT/permanent IAT gateway",
              ),
          ):
              old = (
                  'extern "C" const char *funchook_error_message(funchook_t *funchook)\n'
                  '{\n'
                  f'    return funchook == nullptr ? "{error_text}" : funchook->error.c_str();\n'
                  '}\n'
              )
              new = old + (
                  '\nextern "C" const char *funchook_backend_id(void)\n'
                  '{\n'
                  f'    return "{backend_id}";\n'
                  '}\n'
                  '\nextern "C" const char *funchook_backend_name(void)\n'
                  '{\n'
                  f'    return "{backend_name}";\n'
                  '}\n'
              )
              replace_once(path, old, new)

          replace_once(
              "src/core/profiler/profiler_export.cpp",
              "    if (mode_ == ProfileMode::Allocation) {\n"
              "#ifdef _WIN32\n"
              "        meta.engine_version = std::string(\"endstone-spark \") + kVersion + \" native-ucrt/funchook\";\n"
              "#elif defined(__linux__)\n"
              "        meta.engine_version = std::string(\"endstone-spark \") + kVersion + \" native-glibc/elf-import\";\n"
              "#else\n"
              "        meta.engine_version = std::string(\"endstone-spark \") + kVersion + \" native-allocation\";\n"
              "#endif\n"
              "    }\n",
              "    if (mode_ == ProfileMode::Allocation) {\n"
              "        meta.engine_version =\n"
              "            std::string(\"endstone-spark \") + kVersion + \" \" + AllocationSampler::backendId();\n"
              "    }\n",
          )
          replace_once(
              "src/core/profiler/profiler_export.cpp",
              "#ifdef _WIN32\n"
              "        meta.extra_platform_metadata[\"Allocation backend\"] = jsonString(\"Windows UCRT/funchook\");\n"
              "        meta.extra_platform_metadata[\"Allocation coverage\"] =\n",
              "#ifdef _WIN32\n"
              "        meta.extra_platform_metadata[\"Allocation backend\"] = jsonString(AllocationSampler::backendName());\n"
              "        meta.extra_platform_metadata[\"Allocation coverage\"] =\n",
          )
          replace_once(
              "src/core/profiler/profiler_export.cpp",
              "#elif defined(__linux__)\n"
              "        meta.extra_platform_metadata[\"Allocation backend\"] = jsonString(\"Linux glibc/ELF import slots\");\n"
              "        meta.extra_platform_metadata[\"Allocation coverage\"] =\n",
              "#elif defined(__linux__)\n"
              "        meta.extra_platform_metadata[\"Allocation backend\"] = jsonString(AllocationSampler::backendName());\n"
              "        meta.extra_platform_metadata[\"Allocation coverage\"] =\n",
          )

          replace_once(
              "tests/core/profiler/profiler_export_test.cpp",
              "bool metadataBoolean(std::string_view profile, std::string_view key, bool expected)\n"
              "{\n"
              "    std::string value;\n"
              "    return findExtraMetadataValue(profile, key, value) && value == (expected ? \"true\" : \"false\");\n"
              "}\n",
              "bool metadataBoolean(std::string_view profile, std::string_view key, bool expected)\n"
              "{\n"
              "    std::string value;\n"
              "    return findExtraMetadataValue(profile, key, value) && value == (expected ? \"true\" : \"false\");\n"
              "}\n"
              "\n"
              "bool metadataJsonString(std::string_view profile, std::string_view key, std::string_view expected)\n"
              "{\n"
              "    std::string value;\n"
              "    return findExtraMetadataValue(profile, key, value) && value == std::string(\"\\\"\") + std::string(expected) + \"\\\"\";\n"
              "}\n",
          )
          replace_once(
              "tests/core/profiler/profiler_export_test.cpp",
              "    if (allocation_profile.empty() ||\n"
              "        !metadataUnsigned(allocation_profile, \"Allocation terminal in-flight tick samples discarded\", 0) ||\n",
              "    if (allocation_profile.empty() ||\n"
              "        allocation_profile.find(spark::AllocationSampler::backendId()) == std::string::npos ||\n"
              "        !metadataJsonString(allocation_profile, \"Allocation backend\", spark::AllocationSampler::backendName()) ||\n"
              "        !metadataUnsigned(allocation_profile, \"Allocation terminal in-flight tick samples discarded\", 0) ||\n",
          )
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'native-ucrt/permanent-iat' src/native/alloc/windows_permanent_iat_funchook_compat.cpp
          grep -q 'AllocationSampler::backendName' src/core/profiler/profiler_export.cpp
          grep -q 'metadataJsonString' tests/core/profiler/profiler_export_test.cpp
          git diff --stat
          git diff

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr49-one-shot-backend-metadata-fix.yml
          git add src/funchook.h \
                  src/native/alloc/allocation_sampler.h \
                  src/native/alloc/allocation_sampler_windows.cpp \
                  src/native/alloc/allocation_sampler_linux.cpp \
                  src/native/alloc/allocation_sampler_stub.cpp \
                  src/native/alloc/windows_iat_funchook_compat.cpp \
                  src/native/alloc/windows_permanent_iat_funchook_compat.cpp \
                  src/core/profiler/profiler_export.cpp \
                  tests/core/profiler/profiler_export_test.cpp
          git diff --cached --check
          git commit -m "fix: report actual Windows allocation backend"
          git push origin HEAD:exp/windows-stable-entry-hooks
