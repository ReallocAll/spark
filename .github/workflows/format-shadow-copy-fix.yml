name: Format shadow-copy loader fix

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/windows-allocation-safe-hooks
          fetch-depth: 0
      - name: Install clang-format 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20
      - name: Format and self-remove
        run: |
          clang-format-20 -i src/native/alloc/windows_iat_funchook_compat.cpp
          git rm .github/workflows/format-shadow-copy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/alloc/windows_iat_funchook_compat.cpp
          git commit -m "style: clang-format shadow-copy loader fix"
          git push origin HEAD:fix/windows-allocation-safe-hooks
