name: Apply native callback observer filter

on:
  push:
    branches:
      - perf/python-native-callback-bridge
    paths:
      - ".github/workflows/apply-native-callback-observer-filter.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v7
        with:
          ref: perf/python-native-callback-bridge

      - name: Apply observer filter patch
        run: python .github/scripts/apply_native_callback_observer_filter.py

      - name: Format touched C++
        run: clang-format -i src/core/profiler/native_attribution.cpp tests/core/profiler/native_plugin_attribution_test.cpp

      - name: Verify focused diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "src/core/profiler/native_attribution.cpp"
          test "${changed[1]}" = "tests/core/profiler/native_plugin_attribution_test.cpp"

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/profiler/native_attribution.cpp tests/core/profiler/native_plugin_attribution_test.cpp
          git commit -m "fix: filter native Python observer callbacks"
          git push origin HEAD:perf/python-native-callback-bridge
