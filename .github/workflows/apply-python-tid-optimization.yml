name: Apply measured Python callback TID optimization

on:
  push:
    branches:
      - perf/self-overhead
    paths:
      - ".github/workflows/apply-python-tid-optimization.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: perf/self-overhead

      - name: Apply focused callback fast-path change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/platform/endstone/python_attribution.h")
          text = path.read_text(encoding="utf-8")
          dispatch = "    static void dispatchDirectEvent(PythonExecutionEvent event, PyObject *code) noexcept\n"
          call = "        backend->shadow_.onEvent(currentNativeThreadId(), event, code_id);"
          if text.count(dispatch) != 1:
              raise SystemExit(f"expected one dispatch marker, found {text.count(dispatch)}")
          if text.count(call) != 1:
              raise SystemExit(f"expected one direct TID callback call, found {text.count(call)}")
          helper = """    static std::uint64_t callbackNativeThreadId() noexcept
          {
              // PEP 669 callbacks always execute on the Python thread they describe.
              // Native thread IDs are stable for a thread's lifetime, so resolve the
              // OS TID once per callback thread instead of issuing gettid for every
              // Python execution event on Linux.
              thread_local const std::uint64_t native_tid = currentNativeThreadId();
              return native_tid;
          }

          """
          text = text.replace(dispatch, helper + dispatch, 1)
          text = text.replace(call, "        backend->shadow_.onEvent(callbackNativeThreadId(), event, code_id);", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format touched source
        shell: bash
        run: clang-format -i src/platform/endstone/python_attribution.h

      - name: Verify diff is focused
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/platform/endstone/python_attribution.h
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/platform/endstone/python_attribution.h"

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/endstone/python_attribution.h
          git commit -m "perf: cache Python callback native thread id"
          git push origin HEAD:perf/self-overhead
