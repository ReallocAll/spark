name: PR49 Format Snapshot

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/pr49-format-snapshot.yml"

permissions:
  contents: write

jobs:
  apply-format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: exp/windows-stable-entry-hooks
      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20
      - name: Apply repository formatting
        run: |
          git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format-20 -i
          git diff --check
          git diff --name-only -- '*.cpp' '*.h'
          if git diff --quiet -- '*.cpp' '*.h'; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cpp' '*.h'
          git commit -m "style: format Windows allocation research"
          git push origin HEAD:exp/windows-stable-entry-hooks
