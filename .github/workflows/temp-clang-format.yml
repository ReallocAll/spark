name: Temporary clang-format

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks
    paths:
      - .github/workflows/temp-clang-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/windows-allocation-safe-hooks
      - name: Install clang-format 20
        run: python -m pip install --disable-pip-version-check clang-format==20.1.8
      - name: Format changed Windows IAT sources
        run: |
          clang-format -i src/native/alloc/windows_iat_hooks_windows.cpp tests/native/alloc/windows_iat_native_test.cpp
          git diff --check
      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-clang-format.yml
          git add src/native/alloc/windows_iat_hooks_windows.cpp tests/native/alloc/windows_iat_native_test.cpp
          git commit -m "style: format Windows IAT regression test"
          git push origin HEAD:fix/windows-allocation-safe-hooks
