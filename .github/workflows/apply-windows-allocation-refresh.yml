name: Apply Windows allocation refresh

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply production refresh and filtering fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path('src/funchook.h')
          text = header.read_text()
          old = '''int funchook_install(funchook_t *funchook, int flags);\nint funchook_uninstall(funchook_t *funchook, int flags);\n'''
          new = '''int funchook_install(funchook_t *funchook, int flags);\nint funchook_refresh(funchook_t *funchook);\nint funchook_uninstall(funchook_t *funchook, int flags);\n'''
          if old not in text:
              raise SystemExit('funchook refresh declaration anchor not found')
          header.write_text(text.replace(old, new, 1))

          compat = Path('src/native/alloc/windows_iat_funchook_compat.cpp')
          text = compat.read_text()
          anchor = '''extern "C" int funchook_uninstall(funchook_t *funchook, int flags)\n{\n'''
          refresh = '''extern "C" int funchook_refresh(funchook_t *funchook)\n{\n    if (funchook == nullptr) {\n        return FUNCHOOK_ERROR_INTERNAL;\n    }\n    if (!funchook->installed || funchook->hooks == nullptr) {\n        return FUNCHOOK_ERROR_NOT_INSTALLED;\n    }\n    try {\n        funchook->error.clear();\n        if (!funchook->hooks->refresh(funchook->error)) {\n            return FUNCHOOK_ERROR_INTERNAL;\n        }\n        return FUNCHOOK_ERROR_SUCCESS;\n    }\n    catch (const std::exception &exception) {\n        funchook->error = std::string("Windows IAT allocation hook refresh failed: ") + exception.what();\n        return FUNCHOOK_ERROR_INTERNAL;\n    }\n    catch (...) {\n        funchook->error = "Windows IAT allocation hook refresh failed";\n        return FUNCHOOK_ERROR_INTERNAL;\n    }\n}\n\n'''
          if anchor not in text:
              raise SystemExit('funchook uninstall anchor not found')
          compat.write_text(text.replace(anchor, refresh + anchor, 1))

          sampler = Path('src/native/alloc/allocation_sampler_windows.cpp')
          text = sampler.read_text()
          old = '''constexpr std::uint32_t KFramesToSkip = 2;\n'''
          new = '''constexpr std::uint32_t KFramesToSkip = 2;\nconstexpr std::uint64_t KHookRefreshIntervalMs = 2000;\n'''
          if old not in text:
              raise SystemExit('allocation constants anchor not found')
          text = text.replace(old, new, 1)

          old = '''bool equalsIgnoreCase(const std::string &a, const char *b)\n{\n    return ::_stricmp(a.c_str(), b) == 0;\n}\n\nbool isLeadingAllocatorRuntime(const std::string &path)\n{\n    const std::string name = moduleBasename(path);\n    return equalsIgnoreCase(name, "spark.dll") || equalsIgnoreCase(name, "ucrtbase.dll") ||\n           equalsIgnoreCase(name, "vcruntime140.dll") || equalsIgnoreCase(name, "vcruntime140_1.dll") ||\n           equalsIgnoreCase(name, "msvcp140.dll");\n}\n'''
          new = '''bool equalsIgnoreCase(const std::string &a, const char *b)\n{\n    return ::_stricmp(a.c_str(), b) == 0;\n}\n\nbool startsWithIgnoreCase(const std::string &value, const char *prefix)\n{\n    const std::size_t prefix_length = std::strlen(prefix);\n    return value.size() >= prefix_length && ::_strnicmp(value.c_str(), prefix, prefix_length) == 0;\n}\n\nbool isLeadingAllocatorRuntime(const std::string &path)\n{\n    const std::string name = moduleBasename(path);\n    return equalsIgnoreCase(name, "spark.dll") || equalsIgnoreCase(name, "endstone_spark.dll") ||\n           startsWithIgnoreCase(name, "endstone_spark-") || equalsIgnoreCase(name, "spark_allocation_shim.dll") ||\n           equalsIgnoreCase(name, "ucrtbase.dll") || equalsIgnoreCase(name, "vcruntime140.dll") ||\n           equalsIgnoreCase(name, "vcruntime140_1.dll") || equalsIgnoreCase(name, "msvcp140.dll");\n}\n'''
          if old not in text:
              raise SystemExit('allocator frame filter anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (config.aggregator_delay_ms_for_testing != 0) {\n            std::this_thread::sleep_for(std::chrono::milliseconds(config.aggregator_delay_ms_for_testing));\n        }\n        while (aggregator_running.load(std::memory_order_acquire)) {\n            {\n                std::scoped_lock lock(aggregate_mutex);\n                drainQueues();\n            }\n            std::this_thread::sleep_for(std::chrono::milliseconds(1));\n        }\n'''
          new = '''        if (config.aggregator_delay_ms_for_testing != 0) {\n            std::this_thread::sleep_for(std::chrono::milliseconds(config.aggregator_delay_ms_for_testing));\n        }\n        std::uint64_t next_hook_refresh_ms = monotonicMs() + KHookRefreshIntervalMs;\n        while (aggregator_running.load(std::memory_order_acquire)) {\n            const std::uint64_t now_ms = monotonicMs();\n            if (now_ms >= next_hook_refresh_ms) {\n                if (hooks == nullptr || funchook_refresh(hooks) != FUNCHOOK_ERROR_SUCCESS) {\n                    const char *hook_error = funchook_error_message(hooks);\n                    throw std::runtime_error(std::string("allocation hook refresh failed: ") +\n                                             (hook_error != nullptr ? hook_error : "unknown hook refresh failure"));\n                }\n                next_hook_refresh_ms = now_ms + KHookRefreshIntervalMs;\n            }\n            {\n                std::scoped_lock lock(aggregate_mutex);\n                drainQueues();\n            }\n            std::this_thread::sleep_for(std::chrono::milliseconds(1));\n        }\n'''
          if old not in text:
              raise SystemExit('aggregator refresh anchor not found')
          sampler.write_text(text.replace(old, new, 1))

          fixture = Path('tests/native/alloc/windows_allocation_fixture.cpp')
          fixture.write_text('''#include <windows.h>\n\n#include <cstdlib>\n\nextern "C" __declspec(dllexport) void sparkAllocationFixtureOnce()\n{\n    void *pointer = std::malloc(256);\n    if (pointer != nullptr) {\n        static_cast<volatile unsigned char *>(pointer)[0] = 1;\n        std::free(pointer);\n    }\n}\n\nextern "C" __declspec(dllexport) void sparkAllocationFixtureRun(volatile LONG *running)\n{\n    while (::InterlockedCompareExchange(running, 1, 1) == 1) {\n        sparkAllocationFixtureOnce();\n        ::SwitchToThread();\n    }\n}\n''')

          test = Path('tests/native/alloc/windows_allocation_unavailable_test.cpp')
          text = test.read_text()
          old = '''#include <cstdio>\n#include <string>\n#include <vector>\n\n#include "native/alloc/allocation_sampler.h"\n'''
          new = '''#include <chrono>\n#include <cstdio>\n#include <string>\n#include <thread>\n#include <vector>\n\n#ifndef WIN32_LEAN_AND_MEAN\n#define WIN32_LEAN_AND_MEAN\n#endif\n#ifndef NOMINMAX\n#define NOMINMAX\n#endif\n#include <windows.h>\n\n#include "native/alloc/allocation_sampler.h"\n'''
          if old not in text:
              raise SystemExit('allocation backend test include anchor not found')
          text = text.replace(old, new, 1)

          old = '''bool runSession(spark::AllocationSampler &sampler, std::uint64_t seed)\n{\n'''
          new = '''using FixtureOnceFn = void (*)();\n\nbool treeContainsModule(const spark::CallTree::Node &node, const spark::ModuleTable &modules, const char *name)\n{\n    if (node.key.module != spark::kInvalidModule) {\n        const std::string &path = modules.path(node.key.module);\n        const std::size_t separator = path.find_last_of("/\\\\");\n        const char *base = separator == std::string::npos ? path.c_str() : path.c_str() + separator + 1;\n        if (::_stricmp(base, name) == 0) {\n            return true;\n        }\n    }\n    for (const auto &[key, child] : node.children) {\n        (void)key;\n        if (treeContainsModule(*child, modules, name)) {\n            return true;\n        }\n    }\n    return false;\n}\n\nbool verifyLateLoadedModuleRefresh(spark::AllocationSampler &sampler)\n{\n    HMODULE fixture = ::LoadLibraryW(L".\\\\spark_windows_allocation_fixture.dll");\n    if (fixture == nullptr) {\n        std::fprintf(stderr, "windows allocation backend: fixture LoadLibraryW failed: %lu\\n",\n                     static_cast<unsigned long>(::GetLastError()));\n        return false;\n    }\n    FixtureOnceFn once = reinterpret_cast<FixtureOnceFn>(::GetProcAddress(fixture, "sparkAllocationFixtureOnce"));\n    if (once == nullptr) {\n        ::FreeLibrary(fixture);\n        return false;\n    }\n\n    std::this_thread::sleep_for(std::chrono::milliseconds(2500));\n    const std::uint64_t before = sampler.hookCalls();\n    constexpr int KCalls = 2048;\n    for (int i = 0; i < KCalls; ++i) {\n        once();\n    }\n    const std::uint64_t delta = sampler.hookCalls() - before;\n    const bool unloaded = ::FreeLibrary(fixture) != FALSE;\n    return unloaded && delta >= static_cast<std::uint64_t>(KCalls);\n}\n\nbool runSession(spark::AllocationSampler &sampler, std::uint64_t seed, bool verify_refresh)\n{\n'''
          if old not in text:
              raise SystemExit('allocation backend test runSession anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if (!sampler.running() || !sampler.hooksInstalled() || sampler.hookTargetCount() == 0 ||\n        sampler.hookCapabilities().empty()) {\n        return false;\n    }\n\n    std::vector<std::string> allocations;\n'''
          new = '''    if (!sampler.running() || !sampler.hooksInstalled() || sampler.hookTargetCount() == 0 ||\n        sampler.hookCapabilities().empty()) {\n        return false;\n    }\n    if (verify_refresh && !verifyLateLoadedModuleRefresh(sampler)) {\n        return false;\n    }\n\n    std::vector<std::string> allocations;\n'''
          if old not in text:
              raise SystemExit('allocation backend test refresh call anchor not found')
          text = text.replace(old, new, 1)

          old = '''    sampler.onTick(1.0);\n\n    error = "sentinel";\n    if (!sampler.stop(error) || !error.empty() || sampler.running() || !sampler.hooksInstalled()) {\n        return false;\n    }\n    return true;\n}\n'''
          new = '''    sampler.onTick(1.0);\n\n    spark::AllocationSnapshot snapshot;\n    if (!sampler.snapshot(snapshot, error) || snapshot.sample_count == 0 ||\n        treeContainsModule(snapshot.tree.root(), snapshot.modules, "spark_allocation_shim.dll")) {\n        return false;\n    }\n\n    error = "sentinel";\n    if (!sampler.stop(error) || !error.empty() || sampler.running() || !sampler.hooksInstalled()) {\n        return false;\n    }\n    return true;\n}\n'''
          if old not in text:
              raise SystemExit('allocation backend test snapshot anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('runSession(sampler, 0x12345678ULL)', 'runSession(sampler, 0x12345678ULL, true)', 1)
          text = text.replace('runSession(sampler, 0x87654321ULL)', 'runSession(sampler, 0x87654321ULL, false)', 1)
          test.write_text(text)

          cmake = Path('tests/CMakeLists.txt')
          text = cmake.read_text()
          old = '''    add_executable(spark_windows_allocation_unavailable_test\n            native/alloc/windows_allocation_unavailable_test.cpp)\n    target_link_libraries(spark_windows_allocation_unavailable_test PRIVATE spark_core)\n'''
          new = '''    add_library(spark_windows_allocation_fixture SHARED native/alloc/windows_allocation_fixture.cpp)\n    set_target_properties(spark_windows_allocation_fixture PROPERTIES\n            RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}"\n            OUTPUT_NAME "spark_windows_allocation_fixture")\n\n    add_executable(spark_windows_allocation_unavailable_test\n            native/alloc/windows_allocation_unavailable_test.cpp)\n    add_dependencies(spark_windows_allocation_unavailable_test spark_windows_allocation_fixture)\n    target_link_libraries(spark_windows_allocation_unavailable_test PRIVATE spark_core)\n'''
          if old not in text:
              raise SystemExit('Windows allocation test CMake anchor not found')
          cmake.write_text(text.replace(old, new, 1))
          PY

      - name: Install clang-format 20
        shell: bash
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20

      - name: Format and validate patch
        shell: bash
        run: |
          clang-format-20 -i \
            src/funchook.h \
            src/native/alloc/allocation_sampler_windows.cpp \
            src/native/alloc/windows_iat_funchook_compat.cpp \
            tests/native/alloc/windows_allocation_fixture.cpp \
            tests/native/alloc/windows_allocation_unavailable_test.cpp
          python - <<'PY'
          from pathlib import Path
          sampler = Path('src/native/alloc/allocation_sampler_windows.cpp').read_text()
          compat = Path('src/native/alloc/windows_iat_funchook_compat.cpp').read_text()
          header = Path('src/funchook.h').read_text()
          test = Path('tests/native/alloc/windows_allocation_unavailable_test.cpp').read_text()
          assert 'funchook_refresh' in header
          assert 'extern "C" int funchook_refresh' in compat
          assert 'KHookRefreshIntervalMs = 2000' in sampler
          assert 'spark_allocation_shim.dll' in sampler
          assert 'endstone_spark-' in sampler
          assert 'funchook_refresh(hooks)' in sampler
          assert 'verifyLateLoadedModuleRefresh' in test
          PY
          git diff --check

      - name: Commit production fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-windows-allocation-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh Windows allocation hooks for late modules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
