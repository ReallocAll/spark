name: Apply Endstone shadow-copy shim path fix

on:
  push:
    branches:
      - fix/windows-allocation-safe-hooks
    paths:
      - ".github/workflows/apply-endstone-shadow-shim-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Patch shim path resolution and revert static CRT experiment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          old = '''    set_target_properties(spark_allocation_shim PROPERTIES
                      OUTPUT_NAME "spark_allocation_shim"
                      MSVC_RUNTIME_LIBRARY "MultiThreaded")
          '''
          # tolerate the actual indentation emitted by the previous fixer
          if old not in text:
              old = '''    set_target_properties(spark_allocation_shim PROPERTIES
                  OUTPUT_NAME "spark_allocation_shim"
                  MSVC_RUNTIME_LIBRARY "MultiThreaded")
          '''
          if old not in text:
              raise SystemExit('static shim runtime block not found')
          text = text.replace(old, '    set_target_properties(spark_allocation_shim PROPERTIES OUTPUT_NAME "spark_allocation_shim")\n', 1)
          cmake.write_text(text)

          path = Path('src/native/alloc/windows_iat_funchook_compat.cpp')
          text = path.read_text()
          old = '''    const std::wstring path = directory + KShimFileName;
              api.module = ::LoadLibraryW(path.c_str());
              if (api.module == nullptr) {
                  error = "LoadLibraryW(spark_allocation_shim.dll) failed: " + std::to_string(::GetLastError());
                  return false;
              }
          '''
          if old not in text:
              old = '''    const std::wstring path = directory + KShimFileName;
              api.module = ::LoadLibraryW(path.c_str());
              if (api.module == nullptr) {
                  error = "LoadLibraryW(spark_allocation_shim.dll) failed: " + std::to_string(::GetLastError());
                  return false;
              }
          '''
          if old not in text:
              # exact repository indentation
              old = '''    const std::wstring path = directory + KShimFileName;
              api.module = ::LoadLibraryW(path.c_str());
              if (api.module == nullptr) {
                  error = "LoadLibraryW(spark_allocation_shim.dll) failed: " + std::to_string(::GetLastError());
                  return false;
              }
          '''
          # normalize by direct literal from source if spacing above did not match
          if old not in text:
              start = text.index('    const std::wstring path = directory + KShimFileName;')
              end_marker = '    api.pin = proc<spark::WindowsAllocationShimPinFn>'
              end = text.index(end_marker, start)
              old = text[start:end]
          new = '''    const std::wstring primary_path = directory + KShimFileName;
              api.module = ::LoadLibraryW(primary_path.c_str());
              if (api.module == nullptr) {
                  const DWORD primary_error = ::GetLastError();

                  // Endstone shadow-copies C++ plugins into plugins/.local before
                  // LoadLibrary so hot reload can replace the original plugin file.
                  // The process-lifetime allocation shim remains next to the original
                  // plugin in plugins/, therefore a module-relative lookup from the
                  // loaded shadow copy must explicitly fall back one level.
                  std::wstring module_directory = directory;
                  while (!module_directory.empty() &&
                         (module_directory.back() == L'\\\\' || module_directory.back() == L'/')) {
                      module_directory.pop_back();
                  }
                  const std::size_t separator = module_directory.find_last_of(L"/\\\\");
                  const std::wstring leaf = separator == std::wstring::npos
                                                ? module_directory
                                                : module_directory.substr(separator + 1);
                  if (leaf != L".local" || separator == std::wstring::npos) {
                      error = "LoadLibraryW(spark_allocation_shim.dll) failed from plugin module directory: " +
                              std::to_string(primary_error);
                      return false;
                  }

                  const std::wstring fallback_path =
                      module_directory.substr(0, separator + 1) + KShimFileName;
                  api.module = ::LoadLibraryW(fallback_path.c_str());
                  if (api.module == nullptr) {
                      error = "LoadLibraryW(spark_allocation_shim.dll) failed from Endstone shadow-copy directory: " +
                              std::to_string(primary_error) + "; plugins parent fallback failed: " +
                              std::to_string(::GetLastError());
                      return false;
                  }
              }

          '''
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Remove temporary diagnostic workflows and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-endstone-shadow-shim-fix.yml
          git rm .github/workflows/diagnose-production-shim-load.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/native/alloc/windows_iat_funchook_compat.cpp
          git commit -m "fix: resolve allocation shim beside Endstone shadow copy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
