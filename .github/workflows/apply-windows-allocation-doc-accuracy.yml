name: Apply Windows allocation documentation correction

on:
  push:
    branches: [docs/windows-allocation-release-accuracy]
    paths:
      - ".github/workflows/apply-windows-allocation-doc-accuracy.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/windows-allocation-release-accuracy
          fetch-depth: 0

      - name: Patch release-facing documentation
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = """`--alloc` profiles successful native allocation requests across process threads on
          Linux x86-64. On Windows, the option remains available for command compatibility
          but fails explicitly because safe allocator entry patching is unavailable.
          Every thread has an independent randomized byte-sampling phase and a non-reused
          """
          new = """`--alloc` profiles successful native allocation requests across process threads on
          Linux x86-64 and Windows x64. Linux redirects supported ELF allocator imports;
          Windows redirects supported allocator IAT slots through a process-lifetime pinned
          shim whose callbacks fall back safely after Spark-owned handlers are detached.
          Every thread has an independent randomized byte-sampling phase and a non-reused
          """
          if old not in text:
              raise SystemExit("README Windows allocation availability block not found")
          text = text.replace(old, new, 1)
          old_live = "On Linux x86-64, `--alloc-live-only` follows sampled allocations through realloc and free calls,"
          new_live = "`--alloc-live-only` follows sampled allocations through realloc and free calls on both supported platforms,"
          if old_live not in text:
              raise SystemExit("README live-only platform block not found")
          text = text.replace(old_live, new_live, 1)
          linux_block = """Linux atomically redirects supported allocator relocations in the main executable
          and loaded ELF modules, including Endstone, native plugins, and Python when they
          import the effective libc allocator. Loaded modules are rescanned at session start
          and every five seconds while profiling; unloaded modules are recognized before
          restoration so stale slots are never written.
          """
          windows_block = linux_block + """
          On Windows x64, Spark redirects supported UCRT and heap allocation imports through
          the pinned `spark_allocation_shim.dll`. Shutdown first closes and drains the shim's
          callback admission gate, then clears Spark-owned handlers and restores IAT slots
          still owned by Spark. Stale or ownership-uncertain slots remain safe because the
          process-lifetime shim falls back to the original allocator without calling unloaded
          Spark plugin code.
          """
          if linux_block not in text:
              raise SystemExit("README Linux allocation backend block not found")
          text = text.replace(linux_block, windows_block, 1)
          readme.write_text(text, encoding="utf-8")

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text(encoding="utf-8")
          old = """Samples allocation stacks by requested bytes on Linux x86-64 by redirecting supported ELF allocator imports. Windows allocation profiling is temporarily unavailable because safe allocator entry patching is unavailable. Hook callbacks enqueue bounded records for later processing. Live exports deep-copy cumulative aggregator state or rebuild a temporary retained tree from the authoritative live index without stopping hooks. The hook path is free of allocations, string construction, and unbounded containers.
          """
          new = """Samples allocation stacks by requested bytes on Linux x86-64 by redirecting supported ELF allocator imports and on Windows x64 by redirecting supported allocator IAT slots through a process-lifetime pinned shim. The Windows shim owns the unload-safe callback gate: teardown closes and drains callbacks, clears Spark-owned handlers, and restores only slots still owned by Spark, while stale shim calls safely fall back to the original allocator. Hook callbacks enqueue bounded records for later processing. Live exports deep-copy cumulative aggregator state or rebuild a temporary retained tree from the authoritative live index without stopping hooks. The hook path is free of allocations, string construction, and unbounded containers.
          """
          if old not in text:
              raise SystemExit("ARCHITECTURE allocation backend block not found")
          architecture.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old = """### Changed

          - **BREAKING**: Temporarily disable Windows native allocation profiling in v0.6;
            `--alloc` now reports that safe allocator entry patching is unavailable. Linux
            x86-64 allocation profiling remains supported.

          ### Fixed
          """
          new = """- Add Windows x64 native allocation profiling through a process-lifetime pinned
            shim and IAT redirection, with fail-closed callback draining and ownership-safe
            teardown before unloadable Spark plugin code is detached.

          ### Fixed
          """
          if old not in text:
              raise SystemExit("CHANGELOG stale Windows allocation block not found")
          changelog.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate documentation and release tooling
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F "Windows allocation profiling is temporarily unavailable" README.md docs CHANGELOG.md
          ! grep -R -F "Temporarily disable Windows native allocation profiling" README.md docs CHANGELOG.md
          ! grep -R -F "safe allocator entry patching is unavailable" README.md docs CHANGELOG.md
          python tests/test_release_changelog.py
          git diff --check

      - name: Commit documentation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-windows-allocation-doc-accuracy.yml
          git add README.md docs/ARCHITECTURE.md CHANGELOG.md
          git commit -m "docs: describe validated Windows allocation backend"
          git push origin HEAD:docs/windows-allocation-release-accuracy
